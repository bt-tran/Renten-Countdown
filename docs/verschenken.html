<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    Weiterleitung der alten Gruß-Adresse.

    Die Seite hieß bis 08/2026 „/verschenken". Über diesen Weg kauft der
    Empfänger die App aber selbst — das Wort stand sichtbar in jeder
    verschickten Nachricht und versprach etwas anderes. Die Seite lebt jetzt
    unter „/gruss".

    GitHub Pages kann keine echte 301 ausliefern, also: `noindex` (damit kein
    Duplikat in den Index kommt), `canonical` auf das Ziel, Meta-Refresh als
    Fallback ohne JavaScript — und JS, das den `?anlass=`-Parameter mitnimmt.
    Ohne das Mitnehmen verlören bereits verschickte Links ihre Personalisierung.

    Bereits verschickte Links dürfen nicht brechen: Diese Datei bleibt.
  -->
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://renten-countdown.de/gruss">
  <meta http-equiv="refresh" content="0; url=/gruss">
  <title>Renten Countdown — weiter zum Gruß</title>

  <!--
    Vorschaubild auch hier: Messenger folgen der Weiterleitung nicht, sie lesen
    die Karte aus der Seite, die hinter dem eingefügten Link liegt. Ohne diese
    Tags bekäme jeder, der einen ALTEN Link frisch verschickt, eine nackte URL
    statt der Gruß-Karte. Zeigt bewusst auf `/gruss` und das neue Bild.

    Wortlaut identisch mit `gruss.html` — Begründung der Arbeitsteilung von
    Bild, Titel und Beschreibung steht dort.
  -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="de_DE">
  <meta property="og:site_name" content="Renten Countdown">
  <meta property="og:title" content="Der ehrlichste Countdown bis zur Rente">
  <meta property="og:description" content="Jemand findet, du bist reif für die Couch. Dein Datum in 30 Einheiten, ein Turbo-Oma-Spruch am Tag. 0,99 € einmalig.">
  <meta property="og:url" content="https://renten-countdown.de/gruss">
  <meta property="og:image" content="https://renten-countdown.de/assets/og-gruss.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Die Turbo-Oma ruft es mit dem Megafon heraus. Titel: Die Rente ist dir gegönnt.">
  <meta name="twitter:card" content="summary_large_image">
  <script>
    (function () {
      window.location.replace("/gruss" + window.location.search + window.location.hash);
    })();
  </script>
</head>
<body>
  <p>Diese Seite ist umgezogen: <a href="/gruss">renten-countdown.de/gruss</a></p>
</body>
</html>
